<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow: #FFED00;
  --yellow-dim: #E6D500;
  --ink: #3A3A3A;
  --white: #FFFFFF;
  --gray-500: #767676;
  --ff-head: "Oswald", "Arial Narrow", sans-serif;
  --ff-body: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--white); color:var(--ink); font-family:var(--ff-body); font-size:17px; }
body{ padding:20px; }
h1{ font-family:var(--ff-head); font-size:20px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-bottom:6px; }
p{ font-size:14px; color:var(--gray-500); margin-bottom:22px; line-height:1.4; }
.choice-btn{
  width:100%; display:flex; align-items:center; gap:14px;
  background:var(--white); border:1.5px solid var(--ink); cursor:pointer;
  padding:16px; margin-bottom:12px; text-align:left; transition:all .15s;
}
.choice-btn:hover{ background:var(--yellow); }
.choice-btn svg{ width:26px; height:26px; flex-shrink:0; }
.choice-title{ font-family:var(--ff-head); font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
.choice-sub{ font-size:12.5px; color:var(--gray-500); margin-top:2px; }
</style>
</head>
<body>
  <h1>K?rcher TermCheck</h1>
  <p>Choose a tool to get started.</p>

  <button class="choice-btn" onclick="openTermSearch()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <div>
      <div class="choice-title">Terminology Search</div>
      <div class="choice-sub">Browse and search the K?rcher termbases</div>
    </div>
  </button>

  <button class="choice-btn" onclick="openAuthorCheck()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <div>
      <div class="choice-title">Author Check</div>
      <div class="choice-sub">Check grammar, terminology, and style rules</div>
    </div>
  </button>

<script>
function openTermSearch() {
  google.script.run.showSidebar();
}
function openAuthorCheck() {
  google.script.run.showAuthorCheckSidebar();
}
</script>
</body>
</html>
