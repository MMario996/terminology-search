<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
<style>
:root{
  --yellow: #FFED00;
  --yellow-dim: #E6D500;
  --ink: #3A3A3A;
  --white: #FFFFFF;
  --gray-50: #FAFAFA;
  --gray-100: #F2F2F2;
  --gray-150: #E9E9E9;
  --gray-200: #DDDDDD;
  --gray-300: #C4C4C4;
  --gray-400: #9A9A9A;
  --gray-500: #767676;
  --gray-600: #565656;
  --red: #D32F2F;
  --ff-head: "Oswald", "Arial Narrow", sans-serif;
  --ff-body: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
*, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--white); color:var(--ink); font-family:var(--ff-body); font-size:13px; -webkit-font-smoothing:antialiased; }
button, input, select{ font-family:inherit; }

#app{ padding:14px; }

.header{ margin-bottom:12px; }
.header h1{ font-family:var(--ff-head); font-size:15px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--ink); }
.header p{ font-size:11.5px; color:var(--gray-500); margin-top:3px; line-height:1.4; }

.search-bar{ display:flex; border:1.6px solid var(--gray-300); background:var(--white); margin-bottom:8px; transition:border-color .15s; }
.search-bar.focused{ border-color:var(--ink); box-shadow:2px 2px 0 var(--yellow); }
#query{ flex:1; min-width:0; border:none; outline:none; padding:9px 8px; font-size:13px; background:transparent; color:var(--ink); }
#query::placeholder{ color:var(--gray-400); }
.search-divider{ width:1px; background:var(--gray-200); }
#lang-select{
  border:none; outline:none; background:var(--gray-50); cursor:pointer;
  padding:0 8px; font-family:var(--ff-head); font-size:11px; font-weight:600;
  letter-spacing:.5px; text-transform:uppercase; color:var(--ink); width:56px;
}

.btn-search{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--yellow); color:var(--ink); border:none; cursor:pointer;
  padding:9px; font-family:var(--ff-head); font-size:11.5px; font-weight:600;
  letter-spacing:.6px; text-transform:uppercase; transition:background .15s; margin-bottom:12px;
}
.btn-search:hover{ background:var(--yellow-dim); }
.btn-search svg{ width:13px; height:13px; }

.search-hint{ font-size:10.5px; color:var(--gray-400); text-align:center; margin:-6px 0 12px; }

.recent{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.recent-chip{
  display:flex; align-items:center; gap:5px; background:var(--gray-50); border:1px solid var(--gray-200);
  padding:3px 4px 3px 9px; font-size:11px; color:var(--gray-600); cursor:pointer;
}
.recent-chip:hover{ border-color:var(--ink); background:var(--white); }
.recent-chip .rc-remove{ display:flex; padding:2px; color:var(--gray-400); }
.recent-chip .rc-remove svg{ width:9px; height:9px; }

.loading-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 10px; }
.loading-text{ font-family:var(--ff-head); font-size:11px; font-weight:600; letter-spacing:.4px; color:var(--gray-500); text-align:center; }

.results-meta{
  font-family:var(--ff-head); font-size:10px; font-weight:600; letter-spacing:.6px;
  text-transform:uppercase; color:var(--gray-400); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--gray-150);
}
.results-meta b{ color:var(--ink); }

.concept-card{
  border:1px solid var(--gray-200); margin-bottom:7px; background:var(--white);
  opacity:0; transform:translateY(6px); animation:cardIn .3s var(--ease) forwards;
}
@keyframes cardIn{ to{ opacity:1; transform:none; } }
.card-header{ display:flex; align-items:center; gap:6px; padding:7px 8px; background:var(--gray-50); border-bottom:1px solid var(--gray-150); cursor:pointer; flex-wrap:wrap; }
.lang-badge{
  font-family:var(--ff-head); font-size:9px; font-weight:700; letter-spacing:.5px;
  padding:2px 6px; background:var(--yellow); color:var(--ink); flex-shrink:0; display:flex; align-items:center; gap:3px;
}
.source-term{
  font-family:var(--ff-head); font-size:13.5px; font-weight:600; letter-spacing:.1px;
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);
}
.source-term mark{ background:var(--yellow); color:var(--ink); }
.status-dot{ width:8px; height:8px; flex-shrink:0; }
.status-approved{ background:var(--yellow); clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); }
.status-forbidden{ border:1.4px solid var(--red); position:relative; }
.status-forbidden::after{ content:''; position:absolute; inset:-1px; background:linear-gradient(to top right, transparent calc(50% - 1px), var(--red) calc(50% - 1px), var(--red) calc(50% + 1px), transparent calc(50% + 1px)); }
.status-new{ border:1.4px solid var(--gray-300); }

.card-body{ display:none; }
.concept-card.expanded .card-body{ display:block; }

.translations{ display:flex; flex-direction:column; gap:0; padding:2px 0; border-top:1px solid var(--gray-100); }
.tl-row{
  display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:12px;
  border-bottom:1px solid var(--gray-100);
}
.tl-row:last-child{ border-bottom:none; }
.tl-lang{ font-family:var(--ff-head); font-size:9px; font-weight:700; letter-spacing:.4px; color:var(--gray-400); display:flex; align-items:center; gap:3px; width:36px; flex-shrink:0; }
.tl-term{ flex:1; min-width:0; font-weight:600; color:var(--ink); word-break:break-word; }
.tl-term mark{ background:var(--yellow); color:var(--ink); }
.tl-forbidden .tl-term{ color:var(--red); text-decoration:line-through; text-decoration-thickness:1.2px; }
.copy-btn-mini{ background:none; border:none; cursor:pointer; color:var(--gray-400); padding:2px; display:flex; flex-shrink:0; }
.copy-btn-mini:hover{ color:var(--ink); }
.copy-btn-mini svg{ width:11px; height:11px; }
.no-translations{ padding:8px; color:var(--gray-400); font-size:11px; }

.state-box{ text-align:center; padding:32px 10px; }
.state-icon-wrap{ display:flex; justify-content:center; margin-bottom:10px; }
.state-icon-wrap svg{ width:34px; height:34px; }
.state-title{ font-family:var(--ff-head); font-size:12px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--ink); margin-bottom:4px; }
.state-sub{ font-size:11px; color:var(--gray-500); line-height:1.45; }

#toast{
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:var(--yellow); font-family:var(--ff-head);
  font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  padding:7px 12px; opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease); z-index:100;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>Terminologie-Suche</h1>
    <p>K?rcher-Fachbegriffe direkt im Dokument nachschlagen.</p>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="query" placeholder="Begriff suchen ?" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="search-divider"></div>
    <select id="lang-select" title="Ausgangssprache">
      <option value="de" selected>DE</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="es">ES</option>
      <option value="it">IT</option>
    </select>
  </div>
  <button class="btn-search" id="searchBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    Suchen
  </button>
  <p class="search-hint">Wildcards: * am Anfang/Ende m?glich</p>

  <div class="recent" id="recentWrap"></div>
  <div id="resultsWrap" aria-live="polite"></div>
</div>

<div id="toast"></div>

<script>
var RECENTS_KEY = 'termcheck_sidebar_recent_v1', MAX_RECENTS = 5;
var STATUS_MSGS = [
  "Termbases werden durchsucht...",
  "Treffer werden abgeglichen...",
  "?bersetzungen werden geladen...",
  "Fast fertig..."
];
var _loadingInterval = null;
var _debounceTimer = null, _requestToken = 0;

var $query = document.getElementById('query');
var $lang = document.getElementById('lang-select');
var $bar = document.getElementById('searchBar');
var $recent = document.getElementById('recentWrap');

document.addEventListener('DOMContentLoaded', function(){
  renderRecents();
  $query.focus();
});

document.getElementById('searchBtn').addEventListener('click', function(){ triggerSearch(); });
$query.addEventListener('keydown', function(e){ if (e.key === 'Enter') { clearTimeout(_debounceTimer); triggerSearch(); } });
$query.addEventListener('focus', function(){ $bar.classList.add('focused'); });
$query.addEventListener('blur', function(){ $bar.classList.remove('focused'); });
$lang.addEventListener('change', function(){ if ($query.value.trim()) triggerSearch(); });

function getRecents(){ try { return JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]'); } catch(e){ return []; } }
function saveRecent(q){
  var list = getRecents().filter(function(r){ return r.toLowerCase() !== q.toLowerCase(); });
  list.unshift(q); list = list.slice(0, MAX_RECENTS);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list)); } catch(e){}
  renderRecents();
}
function renderRecents(){
  var list = getRecents();
  if (!list.length) { $recent.innerHTML = ''; return; }
  $recent.innerHTML = list.map(function(q){
    return '<div class="recent-chip" onclick="applyRecent(\''+escJs(q)+'\')">'+
      '<span>'+esc(q)+'</span>'+
      '<span class="rc-remove" onclick="removeRecent(\''+escJs(q)+'\', event)">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>'+
      '</span></div>';
  }).join('');
}
function removeRecent(q, ev){
  ev.stopPropagation();
  var list = getRecents().filter(function(r){ return r !== q; });
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list)); } catch(e){}
  renderRecents();
}
function applyRecent(q){ $query.value = q; triggerSearch(); }

function triggerSearch(){
  var q = $query.value.trim();
  if (!q) return;
  var core = q.replace(/\*/g, '').trim();
  var $rw = document.getElementById('resultsWrap');
  if (core.length < 1) { showState($rw, 'warn', 'Suchbegriff zu kurz', 'Bitte mindestens ein Zeichen eingeben.'); return; }

  var myToken = ++_requestToken;
  startLoading($rw);
  var src = $lang.value;
  google.script.run
    .withSuccessHandler(function(concepts){
      if (myToken !== _requestToken) return;
      stopLoading();
      saveRecent(q);
      renderResults($rw, concepts, q);
    })
    .withFailureHandler(function(err){
      if (myToken !== _requestToken) return;
      stopLoading();
      showState($rw, 'error', 'Fehler', (err && err.message) ? err.message : String(err));
    })
    .apiSearchTerms(q, src);
}

function startLoading(wrap){
  stopLoading();
  var idx = 0;
  function render(){
    wrap.innerHTML = '<div class="loading-state"><div class="loading-text">'+esc(STATUS_MSGS[idx % STATUS_MSGS.length])+'</div></div>';
    idx++;
  }
  render();
  _loadingInterval = setInterval(render, 1200);
}
function stopLoading(){ if (_loadingInterval) { clearInterval(_loadingInterval); _loadingInterval = null; } }

function renderResults(wrap, concepts, query){
  if (!concepts || concepts.length === 0){
    showState(wrap, 'empty', 'Keine Treffer', 'F?r "'+esc(query)+'" wurden keine Begriffe gefunden.');
    return;
  }
  var n = concepts.length;
  var meta = '<div class="results-meta"><b>'+n+'</b> Treffer f?r "'+esc(query)+'"</div>';
  var cards = concepts.map(function(c, i){ return renderCard(c, query, i); }).join('');
  wrap.innerHTML = meta + cards;
}

function renderCard(c, query, idx){
  var src = c.sourceTerm;
  if (!src) return '';
  var delay = Math.min(idx * 30, 200);
  var statusClass = src.forbidden ? 'status-forbidden' : (src.status === 'APPROVED' ? 'status-approved' : 'status-new');

  var header =
    '<div class="card-header" onclick="toggleCard(this)">'+
      '<span class="lang-badge">'+getFlagHtml(src.lang)+esc((src.lang||'').toUpperCase())+'</span>'+
      '<span class="source-term">'+highlight(esc(src.term), query)+'</span>'+
      '<span class="status-dot '+statusClass+'"></span>'+
    '</div>';

  var tlHtml;
  if (c.translations && c.translations.length){
    var rows = c.translations.map(function(t){
      return '<div class="tl-row'+(t.forbidden?' tl-forbidden':'')+'">'+
        '<span class="tl-lang">'+getFlagHtml(t.lang)+esc((t.lang||'').toUpperCase())+'</span>'+
        '<span class="tl-term">'+highlight(esc(t.term), query)+'</span>'+
        '<button class="copy-btn-mini" title="Kopieren" onclick="event.stopPropagation();copyTerm(\''+escJs(t.term)+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>'+
        '</button></div>';
    }).join('');
    tlHtml = '<div class="translations">'+rows+'</div>';
  } else {
    tlHtml = '<div class="no-translations">Keine ?bersetzungen vorhanden</div>';
  }

  return '<div class="concept-card expanded" style="animation-delay:'+delay+'ms">'+header+'<div class="card-body">'+tlHtml+'</div></div>';
}

function toggleCard(el){ el.closest('.concept-card').classList.toggle('expanded'); }

function copyTerm(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  showToast('"'+text+'" kopiert');
}

function showState(wrap, type, title, sub){
  var icons = {
    empty: '<svg viewBox="0 0 64 64" fill="none"><rect x="8" y="8" width="48" height="48" stroke="#3A3A3A" stroke-width="2.5"/><circle cx="27" cy="27" r="10" stroke="#3A3A3A" stroke-width="2.5" fill="none"/><path d="M35 35l12 12" stroke="#3A3A3A" stroke-width="2.5"/></svg>',
    warn: '<svg viewBox="0 0 64 64" fill="none"><polygon points="32,10 58,54 6,54" stroke="#3A3A3A" stroke-width="2.5" fill="#FFED00"/><line x1="32" y1="24" x2="32" y2="38" stroke="#3A3A3A" stroke-width="3"/><circle cx="32" cy="45" r="2" fill="#3A3A3A"/></svg>',
    error: '<svg viewBox="0 0 64 64" fill="none"><rect x="10" y="10" width="44" height="44" stroke="#D32F2F" stroke-width="2.5"/><path d="M22 22l20 20M42 22L22 42" stroke="#D32F2F" stroke-width="2.5"/></svg>'
  };
  wrap.innerHTML = '<div class="state-box"><div class="state-icon-wrap">'+(icons[type]||icons.empty)+'</div>'+
    '<div class="state-title">'+esc(title)+'</div><div class="state-sub">'+esc(sub)+'</div></div>';
}
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

function getFlagHtml(lang){
  var l = String(lang||'').toLowerCase().replace('_', '-');
  var map = { 'en':'gb','en-gb':'gb','en-us':'us','cs':'cz','zh':'cn','zh-cn':'cn','zh-tw':'cn','ja':'jp','ko':'kr','ar':'sa','da':'dk','el':'gr','et':'ee','bs':'ba','vi':'vn','sv':'se','ka':'ge','uk':'ua','sl':'si','he':'il','sq':'al','ur':'pk','fa':'ir','nb':'no','nn':'no','kk':'kz' };
  var country = map[l];
  if (!country) { country = l.includes('-') ? l.split('-')[1] : l; }
  return '<span class="fi fi-'+country+'" style="margin-right:3px;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,0.1) inset;width:1.1em;"></span>';
}

function esc(str){ if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(str){ return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function highlight(escapedText, rawQuery){
  var core = String(rawQuery||'').replace(/\*/g,'').trim();
  if (!core) return escapedText;
  var escCore = esc(core).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!escCore) return escapedText;
  try { var re = new RegExp('('+escCore+')', 'ig'); return escapedText.replace(re, '<mark>$1</mark>'); }
  catch(e){ return escapedText; }
}
</script>
</body>
</html>
